title: 温疫論（呉有性）原文・私評・現代語訳
description: 明の呉有性『温疫論』の原文（句読点つき）、校異・注釈、秋吉質『温疫論私評』の評と細注、別本の偶齋の注と付録、日本語訳と解説
lang: ja
markdown: kramdown
kramdown:
